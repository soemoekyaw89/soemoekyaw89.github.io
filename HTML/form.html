<!DOCTYPE html>

<body>
    <form action="request.php" method="get">
        <label for="stu_name">Name</label>

        <label for="stu_email">Email</label>
        <input type="email" name="stuEmail" id="stu_email">

        <label for="stu_password">Password</label>
        <input type="password" name="stuPassword" id="stu_password">
        <br><br>

        <input type="phone" name="stuPhone" id="stu_phone">

       <br><br>

       <input type="radio" name="gender" id="female" value="Female"> <label for="female"> Female</label>
       <br><br>
       <label for="">Hobby</label>

       <textarea name="stuAdress" id="address" cols="35" rows="10"></textarea>
       <br><br>
       <input type="text" name="" id="" value="Yangoon">
       <input type="text" name="" id="" value="Mandalay" readonly>

       <input type="time" name="" id="">
       <input type="color" name="" id="">
       <input type="range" name="" id="">
       <br><br>
        <button type="submit">Register</button>
